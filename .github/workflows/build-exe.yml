name: Build Windows EXE

on:
  # Manual trigger from GitHub Actions tab
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'onefolder'
        type: choice
        options:
          - onefolder
          - onefile
  
  # Trigger on release creation
  release:
    types: [created]
  
  # Optional: trigger on push to main (comment out if not needed)
  # push:
  #   branches: [main]
  #   paths:
  #     - '**.py'
  #     - 'requirements.txt'
  #     - 'kc_annotation.spec'

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Build EXE (one-folder mode)
        if: ${{ github.event.inputs.build_type != 'onefile' }}
        run: |
          pyinstaller kc_annotation.spec
      
      - name: Build EXE (one-file mode)
        if: ${{ github.event.inputs.build_type == 'onefile' }}
        run: |
          pyinstaller kc_annotation.spec --onefile
      
      - name: List build output
        run: |
          Get-ChildItem -Path dist -Recurse | Select-Object FullName, Length
        shell: pwsh
      
      - name: Create ZIP archive (one-folder)
        if: ${{ github.event.inputs.build_type != 'onefile' }}
        run: |
          Compress-Archive -Path dist/kc_annotation/* -DestinationPath kc_annotation_windows.zip
        shell: pwsh
      
      - name: Create ZIP archive (one-file)
        if: ${{ github.event.inputs.build_type == 'onefile' }}
        run: |
          Compress-Archive -Path dist/kc_annotation.exe -DestinationPath kc_annotation_windows.zip
        shell: pwsh
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kc_annotation_windows
          path: kc_annotation_windows.zip
          retention-days: 30
      
      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: kc_annotation_windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Optional: Build for macOS as well
  build-macos:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Build App
        run: |
          pyinstaller kc_annotation.spec
      
      - name: Create ZIP archive
        run: |
          cd dist && zip -r ../kc_annotation_macos.zip kc_annotation/
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kc_annotation_macos
          path: kc_annotation_macos.zip
          retention-days: 30
      
      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: kc_annotation_macos.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
